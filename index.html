<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            The awesome Challenge List
        </title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/account.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script
            src="https://unpkg.com/vue@3.2.31/dist/vue.global.prod.js"
            integrity="sha256-2ndwnHC+N2Yt4HwOAdoyAb6R6u9Ddt+R3TBGij6U35Q="
            crossorigin="anonymous"
        ></script>
        <script
            src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"
            integrity="sha256-vgK1JbT4ehs70XoL7m0MYISjBTgDX2SLNn+XT2EaqWA="
            crossorigin="anonymous"
        ></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>TaCL</h2>
                <p>{{ siteVersion }}</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/submit">
                    <span class="type-label-lg">Submit</span>
                </router-link>
                <router-link v-if="store.user?.role === 'admin' || store.user?.role === 'moderator'" class="nav__tab" to="/admin">
                    <span class="type-label-lg">Admin</span>
                </router-link>
                <a class="nav__tab" href="/docs/">
                    <span class="type-label-lg">Docs</span>
                </a>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        type="button"
                        aria-label="Toggle dark mode"
                        @click.prevent="store.toggleDark()"
                    >
                        <img
                            :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <a class="nav__icon" href="https://discord.gg/bGdP4F2nKu" target="_blank" rel="noopener noreferrer" aria-label="Join the Discord">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <router-link v-if="store.user" class="nav__cta type-label-lg" to="/account">
                        {{ store.user.displayName || store.user.username }}
                    </router-link>
                    <router-link v-else class="nav__cta type-label-lg" to="/account">
                        Sign in
                    </router-link>
                    <button v-if="store.user" class="nav__signout" type="button" @click="store.signOut()">Sign out</button>
                </div>
            </nav>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
